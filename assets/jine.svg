<svg xmlns="http://www.w3.org/2000/svg" width="860" height="414" viewBox="0 0 860 414">
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#6b3cf0"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="1.6" fill="#ffffff" opacity=".6"/>
    </pattern>
    <symbol id="heart" viewBox="0 0 16 14"><path d="M8 14 1.6 7.6A3.9 3.9 0 0 1 8 2.6a3.9 3.9 0 0 1 6.4 5Z"/></symbol>
    <g id="ame">
      <circle r="17" fill="#2b2140" stroke="#ffffff" stroke-width="2"/>
      <path d="M-12 -4q12 -16 24 0v6h-24z" fill="#3c2c5e"/>
      <circle cx="-5" cy="3" r="2.2" fill="#ff8fd8"/><circle cx="5" cy="3" r="2.2" fill="#ff8fd8"/>
      <use href="#heart" x="5" y="-16" width="9" height="8" fill="#ff4f7a"/>
    </g>
  </defs>
  <style>
    .t { font-family: 'Courier New', Courier, monospace; font-weight: 700; font-size: 15px; }
    .m { opacity: 0; animation: pop .45s ease-out both; }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .dots circle { animation: d 1.2s infinite; }
    @keyframes d { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  </style>

  <!-- window -->
  <rect x="6" y="6" width="848" height="402" rx="6" fill="#ffffff" stroke="#4d22cf" stroke-width="3"/>
  <rect x="9" y="9" width="842" height="30" rx="3" fill="url(#bar)"/>
  <rect x="18" y="15" width="20" height="18" rx="5" fill="#52d36a"/>
  <path d="M23 33l3-5h6z" fill="#52d36a"/>
  <text class="t" x="46" y="30" font-size="16" fill="#fff">JINE ─ Ame ♡</text>
  <g fill="#fff" stroke="#4d22cf" stroke-width="1.5"><rect x="822" y="14" width="20" height="20" rx="2"/></g>
  <path d="M827 19l10 10M837 19l-10 10" stroke="#4d22cf" stroke-width="2"/>

  <rect x="12" y="42" width="836" height="324" fill="#f6c9ee"/>
  <rect x="12" y="42" width="836" height="324" fill="url(#dots)"/>

  <!-- day separator -->
  <rect x="385" y="52" width="90" height="20" rx="10" fill="#c79be8"/>
  <text class="t" x="430" y="67" fill="#fff" text-anchor="middle" font-size="13">Night</text>

  <!-- 1 -->
  <g class="m" style="animation-delay:.3s">
    <use href="#ame" x="38" y="98"/>
    <rect x="64" y="82" width="270" height="34" rx="10" fill="#c9ecff"/>
    <text class="t" x="78" y="104" fill="#3b2a6b">P-chan!! you came (≧▽≦)</text>
  </g>
  <!-- 2 -->
  <g class="m" style="animation-delay:1.3s">
    <rect x="566" y="126" width="270" height="34" rx="10" fill="#ffffff"/>
    <text class="t" x="580" y="148" fill="#3b2a6b">hi hi~ what are you up to?</text>
  </g>
  <!-- 3 -->
  <g class="m" style="animation-delay:2.3s">
    <use href="#ame" x="38" y="196"/>
    <rect x="64" y="170" width="410" height="54" rx="10" fill="#c9ecff"/>
    <text class="t" x="78" y="192" fill="#3b2a6b">porting NEEDY GIRL OVERDOSE to the 3DS!!</text>
    <text class="t" x="78" y="212" fill="#3b2a6b">two screens, C + Lua, zero sleep ♡</text>
  </g>
  <!-- 4 -->
  <g class="m" style="animation-delay:3.4s">
    <use href="#ame" x="38" y="250"/>
    <rect x="64" y="234" width="450" height="34" rx="10" fill="#c9ecff"/>
    <text class="t" x="78" y="256" fill="#3b2a6b">also discord bots in rust... and websites...</text>
  </g>
  <!-- 5 -->
  <g class="m" style="animation-delay:4.4s">
    <rect x="716" y="278" width="120" height="34" rx="10" fill="#ffffff"/>
    <text class="t" x="732" y="300" fill="#3b2a6b">go to bed</text>
  </g>
  <!-- 6 -->
  <g class="m" style="animation-delay:5.4s">
    <use href="#ame" x="38" y="338"/>
    <rect x="64" y="322" width="230" height="34" rx="10" fill="#c9ecff"/>
    <text class="t" x="78" y="344" fill="#3b2a6b">no. one more commit ☆</text>
  </g>
  <!-- typing... -->
  <g class="m dots" style="animation-delay:6.2s">
    <rect x="310" y="330" width="56" height="20" rx="10" fill="#ffffff" opacity=".8"/>
    <circle cx="326" cy="340" r="3" fill="#b07ae0"/>
    <circle cx="338" cy="340" r="3" fill="#b07ae0" style="animation-delay:.2s"/>
    <circle cx="350" cy="340" r="3" fill="#b07ae0" style="animation-delay:.4s"/>
  </g>

  <!-- stickers bar -->
  <rect x="12" y="368" width="836" height="36" fill="#ffffff"/>
  <rect x="24" y="374" width="812" height="24" rx="4" fill="#fbeefa" stroke="#c79be8"/>
  <text class="t" x="430" y="391" fill="#7a5bc7" text-anchor="middle" font-size="14">☺ Stickers</text>
</svg>
