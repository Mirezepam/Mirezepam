<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd3f1"/>
      <stop offset=".55" stop-color="#ead6ff"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#6b3cf0"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity=".45"/>
    </pattern>
    <symbol id="heart" viewBox="0 0 16 14"><path d="M8 14 1.6 7.6A3.9 3.9 0 0 1 8 2.6a3.9 3.9 0 0 1 6.4 5Z"/></symbol>
    <symbol id="star" viewBox="0 0 10 10"><path d="M5 0 6.1 3.9 10 5 6.1 6.1 5 10 3.9 6.1 0 5 3.9 3.9Z"/></symbol>
  </defs>
  <style>
    .t { font-family: 'Courier New', Courier, monospace; font-weight: 700; }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    .tw { animation: tw 2.2s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: .15; } }
    .blink { animation: blink 1.1s steps(2, start) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .glitch { animation: gl 3.5s infinite; }
    @keyframes gl {
      0%, 90%, 100% { transform: translate(0, 0); }
      91% { transform: translate(-4px, 1px); }
      93% { transform: translate(4px, -1px); }
      95% { transform: translate(-2px, 0); }
      97% { transform: translate(2px, 1px); }
    }
    .cyan { animation: cy 3.5s infinite; } @keyframes cy { 0%, 89%, 100% { opacity: 0; } 90%, 98% { opacity: .85; } }
    .pink { animation: pk 3.5s infinite; } @keyframes pk { 0%, 89%, 100% { opacity: 0; } 90%, 98% { opacity: .85; } }
    .type { animation: type 3s steps(40) .4s both; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  </style>

  <!-- window -->
  <rect x="6" y="6" width="848" height="288" rx="6" fill="#ffffff" stroke="#4d22cf" stroke-width="3"/>
  <rect x="9" y="9" width="842" height="30" rx="3" fill="url(#bar)"/>
  <use href="#heart" x="20" y="16" width="18" height="16" fill="#fff"/>
  <text class="t" x="46" y="30" font-size="16" fill="#fff">mirocoAM.exe ─ OMGkawaiiDev</text>
  <g fill="#fff" stroke="#4d22cf" stroke-width="1.5">
    <rect x="770" y="14" width="20" height="20" rx="2"/><rect x="796" y="14" width="20" height="20" rx="2"/><rect x="822" y="14" width="20" height="20" rx="2"/>
  </g>
  <g stroke="#4d22cf" stroke-width="2" fill="none">
    <path d="M775 28h10"/><rect x="801" y="19" width="10" height="10"/><path d="M827 19l10 10M837 19l-10 10"/>
  </g>

  <!-- sky -->
  <rect x="12" y="42" width="836" height="246" fill="url(#sky)"/>
  <rect x="12" y="42" width="836" height="246" fill="url(#grid)"/>

  <!-- floating decorations -->
  <g fill="#ff8fd8">
    <g class="float"><use href="#heart" x="70" y="200" width="34" height="30"/></g>
    <g class="float" style="animation-delay:-1.3s"><use href="#heart" x="740" y="80" width="28" height="25"/></g>
    <g class="float" style="animation-delay:-2.6s"><use href="#heart" x="780" y="215" width="20" height="18" fill="#9fd8ff"/></g>
    <g class="float" style="animation-delay:-.7s"><use href="#heart" x="140" y="95" width="18" height="16" fill="#b79bff"/></g>
  </g>
  <g fill="#ffffff">
    <use class="tw" href="#star" x="210" y="70" width="16" height="16"/>
    <use class="tw" style="animation-delay:-.8s" href="#star" x="640" y="60" width="20" height="20"/>
    <use class="tw" style="animation-delay:-1.6s" href="#star" x="610" y="235" width="14" height="14"/>
    <use class="tw" style="animation-delay:-.4s" href="#star" x="250" y="240" width="18" height="18"/>
    <use class="tw" style="animation-delay:-1.1s" href="#star" x="700" y="150" width="12" height="12"/>
    <use class="tw" style="animation-delay:-1.9s" href="#star" x="110" y="150" width="12" height="12"/>
  </g>

  <!-- live badge -->
  <rect x="28" y="56" width="78" height="26" rx="4" fill="#ff3d6e"/>
  <circle class="blink" cx="42" cy="69" r="5" fill="#fff"/>
  <text class="t" x="52" y="75" font-size="16" fill="#fff">LIVE</text>
  <text class="t" x="116" y="75" font-size="14" fill="#4d22cf">♡ 1,000,000 viewers (in my dreams)</text>

  <!-- name -->
  <g class="glitch" text-anchor="middle">
    <text class="t cyan" x="427" y="160" font-size="70" fill="#41e0ff">mirocoAM</text>
    <text class="t pink" x="433" y="160" font-size="70" fill="#ff4fb8">mirocoAM</text>
    <text class="t" x="430" y="160" font-size="70" fill="#ffffff" stroke="#4d22cf" stroke-width="3" paint-order="stroke">mirocoAM</text>
  </g>
  <text class="t type" x="430" y="200" font-size="18" fill="#4d22cf" text-anchor="middle">✧ internet angel developer ✧ P-chan of my own code ✧</text>

  <!-- stream progress bar + day chip -->
  <rect x="28" y="262" width="640" height="6" rx="3" fill="#ffffff" opacity=".8"/>
  <rect x="28" y="262" width="0" height="6" rx="3" fill="#ff3d6e">
    <animate attributeName="width" values="0;640" dur="30s" repeatCount="indefinite"/>
  </rect>
  <rect x="690" y="250" width="140" height="28" rx="14" fill="#4d22cf"/>
  <text class="t" x="760" y="269" font-size="15" fill="#fff" text-anchor="middle">☾ DAY 1 / 30</text>
</svg>
