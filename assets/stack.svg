<svg xmlns="http://www.w3.org/2000/svg" width="420" height="270" viewBox="0 0 420 270">
  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#6b3cf0"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <!-- capsule: left half coloured, right half white -->
    <g id="cap">
      <rect width="176" height="34" rx="17" fill="#ffffff" stroke="#4d22cf" stroke-width="2"/>
    </g>
  </defs>
  <style>
    .t { font-family: 'Courier New', Courier, monospace; font-weight: 700; }
    .p { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  </style>
  <rect x="4" y="4" width="412" height="262" rx="6" fill="#ffffff" stroke="#4d22cf" stroke-width="3"/>
  <rect x="7" y="7" width="406" height="28" rx="3" fill="url(#bar)"/>
  <text class="t" x="18" y="27" font-size="15" fill="#fff">✚ Medicine ─ take as needed</text>
  <rect x="10" y="38" width="400" height="224" fill="#fff4fb"/>

  <g class="t" font-size="15">
    <!-- row 1 -->
    <g class="p">
      <use href="#cap" x="24" y="52"/><path d="M41 52h71v34H41a17 17 0 0 1 0-34z" fill="#9fd8ff"/>
      <rect x="24" y="52" width="176" height="34" rx="17" fill="none" stroke="#4d22cf" stroke-width="2"/>
      <text x="68" y="74" fill="#3b2a6b" text-anchor="middle">C</text><text x="156" y="74" fill="#4d22cf" text-anchor="middle">engine</text>
    </g>
    <g class="p" style="animation-delay:-.5s">
      <use href="#cap" x="220" y="52"/><path d="M237 52h71v34h-71a17 17 0 0 1 0-34z" fill="#b79bff"/>
      <rect x="220" y="52" width="176" height="34" rx="17" fill="none" stroke="#4d22cf" stroke-width="2"/>
      <text x="264" y="74" fill="#3b2a6b" text-anchor="middle">Lua</text><text x="352" y="74" fill="#4d22cf" text-anchor="middle">scripts</text>
    </g>
    <!-- row 2 -->
    <g class="p" style="animation-delay:-1s">
      <use href="#cap" x="24" y="100"/><path d="M41 100h71v34H41a17 17 0 0 1 0-34z" fill="#ff9e7a"/>
      <rect x="24" y="100" width="176" height="34" rx="17" fill="none" stroke="#4d22cf" stroke-width="2"/>
      <text x="68" y="122" fill="#3b2a6b" text-anchor="middle">Rust</text><text x="156" y="122" fill="#4d22cf" text-anchor="middle">bots</text>
    </g>
    <g class="p" style="animation-delay:-1.5s">
      <use href="#cap" x="220" y="100"/><path d="M237 100h71v34h-71a17 17 0 0 1 0-34z" fill="#ffe27a"/>
      <rect x="220" y="100" width="176" height="34" rx="17" fill="none" stroke="#4d22cf" stroke-width="2"/>
      <text x="264" y="122" fill="#3b2a6b" text-anchor="middle">Python</text><text x="352" y="122" fill="#4d22cf" text-anchor="middle">tools</text>
    </g>
    <!-- row 3 -->
    <g class="p" style="animation-delay:-2s">
      <use href="#cap" x="24" y="148"/><path d="M41 148h71v34H41a17 17 0 0 1 0-34z" fill="#fff07a"/>
      <rect x="24" y="148" width="176" height="34" rx="17" fill="none" stroke="#4d22cf" stroke-width="2"/>
      <text x="68" y="170" fill="#3b2a6b" text-anchor="middle" font-size="14">JS</text><text x="156" y="170" fill="#4d22cf" text-anchor="middle">bots</text>
    </g>
    <g class="p" style="animation-delay:-2.5s">
      <use href="#cap" x="220" y="148"/><path d="M237 148h71v34h-71a17 17 0 0 1 0-34z" fill="#ff8fd8"/>
      <rect x="220" y="148" width="176" height="34" rx="17" fill="none" stroke="#4d22cf" stroke-width="2"/>
      <text x="264" y="170" fill="#3b2a6b" text-anchor="middle" font-size="13">HTML/CSS</text><text x="352" y="170" fill="#4d22cf" text-anchor="middle">web</text>
    </g>
    <!-- row 4 -->
    <g class="p" style="animation-delay:-.8s">
      <use href="#cap" x="24" y="196"/><path d="M41 196h71v34H41a17 17 0 0 1 0-34z" fill="#c3b5ff"/>
      <rect x="24" y="196" width="176" height="34" rx="17" fill="none" stroke="#4d22cf" stroke-width="2"/>
      <text x="68" y="218" fill="#3b2a6b" text-anchor="middle">PHP</text><text x="156" y="218" fill="#4d22cf" text-anchor="middle">web</text>
    </g>
    <g class="p" style="animation-delay:-1.8s">
      <use href="#cap" x="220" y="196"/><path d="M237 196h71v34h-71a17 17 0 0 1 0-34z" fill="#8ef0c0"/>
      <rect x="220" y="196" width="176" height="34" rx="17" fill="none" stroke="#4d22cf" stroke-width="2"/>
      <text x="264" y="218" fill="#3b2a6b" text-anchor="middle">Git</text><text x="352" y="218" fill="#4d22cf" text-anchor="middle">daily</text>
    </g>
  </g>
  <text class="t" x="210" y="252" font-size="11" fill="#9a86c9" text-anchor="middle">⚠ do not exceed the recommended dose of side projects</text>
</svg>
