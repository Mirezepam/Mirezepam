<svg xmlns="http://www.w3.org/2000/svg" width="860" height="48" viewBox="0 0 860 48">
  <style>
    .t { font-family: 'Courier New', Courier, monospace; font-weight: 700; }
    .colon { animation: c 1s steps(2, start) infinite; }
    @keyframes c { 50% { opacity: 0; } }
    .mq { animation: mq 14s linear infinite; }
    @keyframes mq { from { transform: translateX(0); } to { transform: translateX(-560px); } }
  </style>
  <defs><clipPath id="clip"><rect x="232" y="8" width="430" height="32"/></clipPath></defs>
  <rect x="0" y="0" width="860" height="48" rx="6" fill="#efe4ff" stroke="#4d22cf" stroke-width="2"/>
  <!-- start button -->
  <rect x="8" y="8" width="104" height="32" rx="4" fill="#ffffff" stroke="#4d22cf" stroke-width="2"/>
  <path d="M22 18h7v7h-7zM31 18h7v7h-7zM22 27h7v7h-7zM31 27h7v7h-7z" fill="#ff7ad9"/>
  <text class="t" x="46" y="30" font-size="15" fill="#4d22cf">Start</text>
  <!-- quick icons -->
  <rect x="124" y="12" width="24" height="24" rx="5" fill="#52d36a"/>
  <rect x="156" y="12" width="24" height="24" rx="5" fill="#5bb8ff"/>
  <rect x="188" y="12" width="24" height="24" rx="5" fill="#b79bff"/>
  <text class="t" x="136" y="29" font-size="12" fill="#fff" text-anchor="middle">J</text>
  <text class="t" x="168" y="29" font-size="12" fill="#fff" text-anchor="middle">P</text>
  <text class="t" x="200" y="29" font-size="12" fill="#fff" text-anchor="middle">♡</text>
  <!-- scrolling message -->
  <rect x="228" y="8" width="438" height="32" rx="4" fill="#ffffff" stroke="#c79be8"/>
  <g clip-path="url(#clip)">
    <g class="mq">
      <text class="t" x="240" y="29" font-size="14" fill="#7a5bc7">★ thanks for visiting!! please star my repos or i'll stream till 4am ★</text>
      <text class="t" x="800" y="29" font-size="14" fill="#7a5bc7">★ thanks for visiting!! please star my repos or i'll stream till 4am ★</text>
    </g>
  </g>
  <!-- clock -->
  <rect x="678" y="8" width="174" height="32" rx="4" fill="#4d22cf"/>
  <text class="t" x="694" y="30" font-size="15" fill="#fff">☾ DAY 1</text>
  <text class="t" x="784" y="30" font-size="15" fill="#fff">23<tspan class="colon">:</tspan>59</text>
</svg>
