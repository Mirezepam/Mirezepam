# Copy this file to .github/workflows/switch-theme.yml, then use
# Actions → "Switch profile theme" → Run workflow → pick a theme.
name: Switch profile theme

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Theme to show on the profile"
        type: choice
        options: [angel, ame]
        default: angel

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the selected theme as README.md
        env:
          THEME: ${{ inputs.theme }}
        run: |
          cp "themes/${THEME}.md" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "theme: ${THEME}"
          git push
